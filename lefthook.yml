# Installé par `npm install` (script prepare). Désactivé en CI via LEFTHOOK=0.
# Recommandé : brew install gitleaks (sinon le scan de secrets local est sauté, la CI le fait).
pre-commit:
  parallel: true
  commands:
    garde-fous:
      run: node scripts/garde-fous.mjs --staged
    secrets:
      run: >-
        if command -v gitleaks >/dev/null; then gitleaks git --pre-commit --staged --redact --no-banner;
        else echo "AVERTISSEMENT gitleaks absent, scan local saute (brew install gitleaks) ; la CI scanne quand meme"; fi
    eslint:
      glob: "*.{ts,tsx,js,mjs}"
      run: "npx eslint --cache --cache-location node_modules/.cache/eslint/ --fix --max-warnings=0 --no-warn-ignored {staged_files}"
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,js,mjs,json,css,md,yml,yaml}"
      run: "npx prettier --write --cache --ignore-unknown --log-level warn {staged_files}"
      stage_fixed: true

pre-push:
  commands:
    verifier:
      run: npm run verifier
